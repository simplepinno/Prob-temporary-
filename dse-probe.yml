name: dse-probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python probe_volume.py
      - name: Save probe output
        if: always()
        run: |
          git config user.name "dse-bot"
          git config user.email "dse-bot@users.noreply.github.com"
          git add probe
          git commit -m "probe output" || echo "nothing to commit"
          git push
